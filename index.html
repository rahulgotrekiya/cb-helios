<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cb-helios — Configurator</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      pre { background: #f4f4f5; padding: 1rem; border-radius: 8px; overflow-x: auto; }
      button { font-size: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Cosmic Byte Helios — Configurator</h1>
    <p>Open in desktop Chrome/Edge/Brave, plug in the mouse or 2.4GHz dongle, then connect.</p>
    <button id="connect">Connect mouse</button>

    <p>
      <label for="effect">RGB effect:</label>
      <select id="effect" disabled></select>
    </p>

    <p>
      <label for="raw">Raw packet (hex):</label>
      <input id="raw" type="text" size="60"
             placeholder="55 21 00 00 03 00 00 00 00 00 01" disabled />
      <button id="send" disabled>Send</button>
    </p>

    <pre id="output">Not connected.</pre>
    <pre id="replies">Replies from mouse will appear here.</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
